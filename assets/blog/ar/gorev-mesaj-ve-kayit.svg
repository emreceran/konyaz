<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" width="760" height="364" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="760" height="364" rx="14" fill="#0F172A"/><rect x="20" y="20" width="350" height="300" rx="10" fill="#111827" stroke="#1E293B"/><text x="38" y="48" font-size="15" fill="#F1F5F9" font-weight="700" text-anchor="start">في مجموعة WhatsApp</text><rect x="38" y="66" width="236" height="38" rx="10" fill="#1B2338"/><text x="50" y="81" font-size="10.5" fill="#A5B4FC" font-weight="600" text-anchor="start">المدير</text><text x="50" y="96" font-size="12.5" fill="#F1F5F9" font-weight="400" text-anchor="start">لتُشحن العيّنة غداً</text><rect x="286" y="114" width="66" height="38" rx="10" fill="#12313A"/><text x="298.5" y="129" font-size="10.5" fill="#22D3EE" font-weight="600" text-anchor="start">علي</text><text x="298.5" y="144" font-size="12.5" fill="#F1F5F9" font-weight="400" text-anchor="start">تمام</text><rect x="38" y="162" width="243" height="38" rx="10" fill="#1B2338"/><text x="50" y="177" font-size="10.5" fill="#A5B4FC" font-weight="600" text-anchor="start">المدير</text><text x="50" y="192" font-size="12.5" fill="#F1F5F9" font-weight="400" text-anchor="start">(بعد 3 أيام) هل ذهبت العيّنة؟</text><rect x="123" y="210" width="229" height="38" rx="10" fill="#12313A"/><text x="135.20000000000002" y="225" font-size="10.5" fill="#22D3EE" font-weight="600" text-anchor="start">علي</text><text x="135.20000000000002" y="240" font-size="12.5" fill="#F1F5F9" font-weight="400" text-anchor="start">ظننت أن عائشة أرسلتها</text><rect x="180" y="258" width="172" height="38" rx="10" fill="#12313A"/><text x="192.0" y="273" font-size="10.5" fill="#22D3EE" font-weight="600" text-anchor="start">عائشة</text><text x="192.0" y="288" font-size="12.5" fill="#F1F5F9" font-weight="400" text-anchor="start">لم يقل لي أحد</text><rect x="390" y="20" width="350" height="300" rx="10" fill="#111827" stroke="#6366F1"/><text x="408" y="48" font-size="15" fill="#F1F5F9" font-weight="700" text-anchor="start">في سجل المهمة</text><text x="408" y="84" font-size="15" fill="#F1F5F9" font-weight="600" text-anchor="start">شحن العيّنة</text><line x1="408" y1="104" x2="722" y2="104" stroke="#1E293B"/><text x="408" y="124" font-size="12" fill="#94A3B8" font-weight="400" text-anchor="start">المسؤول</text><text x="500" y="124" font-size="13" fill="#F1F5F9" font-weight="500" text-anchor="start">عائشة</text><line x1="408" y1="140" x2="722" y2="140" stroke="#1E293B"/><text x="408" y="160" font-size="12" fill="#94A3B8" font-weight="400" text-anchor="start">الموعد النهائي</text><text x="500" y="160" font-size="13" fill="#F1F5F9" font-weight="500" text-anchor="start">الخميس 9/10</text><line x1="408" y1="176" x2="722" y2="176" stroke="#1E293B"/><text x="408" y="196" font-size="12" fill="#94A3B8" font-weight="400" text-anchor="start">الحالة</text><text x="500" y="196" font-size="13" fill="#FBBF24" font-weight="500" text-anchor="start">قيد التنفيذ</text><line x1="408" y1="212" x2="722" y2="212" stroke="#1E293B"/><text x="408" y="232" font-size="12" fill="#94A3B8" font-weight="400" text-anchor="start">من أسندها</text><text x="500" y="232" font-size="13" fill="#F1F5F9" font-weight="500" text-anchor="start">المدير، 7/10</text><line x1="408" y1="248" x2="722" y2="248" stroke="#1E293B"/><text x="408" y="268" font-size="12" fill="#94A3B8" font-weight="400" text-anchor="start">المرفق</text><text x="500" y="268" font-size="13" fill="#94A3B8" font-weight="500" text-anchor="start">بانتظار صورة إيصال الشحن</text><text x="408" y="300" font-size="12" fill="#94A3B8" font-weight="400" text-anchor="start">مكتوب من سينفّذ ومتى ينتهي.</text><text x="20" y="346" font-size="12.5" fill="#94A3B8" font-weight="400" text-anchor="start">العمل نفسه في مكانين. في مجموعة WhatsApp لا صاحب له.</text></svg>