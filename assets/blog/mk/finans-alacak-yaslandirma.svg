<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="760" height="320" rx="14" fill="#0F172A"/><text x="30" y="40" font-size="17" fill="#F1F5F9" font-weight="700" text-anchor="start">Колку се стари побарувањата?</text><text x="30" y="62" font-size="13" fill="#94A3B8" font-weight="400" text-anchor="start">Пример: вкупно 1.820 илј. EUR побарувања според доспевање</text><text x="30" y="105" font-size="13" fill="#F1F5F9" font-weight="500" text-anchor="start">Недоспеани</text><rect x="200" y="88" width="451" height="22" rx="5" fill="#22D3EE"/><text x="661.0" y="104" font-size="12.5" fill="#94A3B8" font-weight="500" text-anchor="start">820 илј. EUR</text><text x="30" y="143" font-size="13" fill="#F1F5F9" font-weight="500" text-anchor="start">Доцнат 1-30 дена</text><rect x="200" y="126" width="226" height="22" rx="5" fill="#FBBF24"/><text x="435.5" y="142" font-size="12.5" fill="#94A3B8" font-weight="500" text-anchor="start">410 илј. EUR</text><text x="30" y="181" font-size="13" fill="#F1F5F9" font-weight="500" text-anchor="start">Доцнат 31-60 дена</text><rect x="200" y="164" width="143" height="22" rx="5" fill="#FB923C"/><text x="353.0" y="180" font-size="12.5" fill="#94A3B8" font-weight="500" text-anchor="start">260 илј. EUR</text><text x="30" y="219" font-size="13" fill="#F1F5F9" font-weight="500" text-anchor="start">Доцнат 61-90 дена</text><rect x="200" y="202" width="77" height="22" rx="5" fill="#F87171"/><text x="287.0" y="218" font-size="12.5" fill="#94A3B8" font-weight="500" text-anchor="start">140 илј. EUR</text><text x="30" y="257" font-size="13" fill="#F1F5F9" font-weight="500" text-anchor="start">Постари од 90 дена</text><rect x="200" y="240" width="105" height="22" rx="5" fill="#DC2626"/><text x="314.5" y="256" font-size="12.5" fill="#94A3B8" font-weight="500" text-anchor="start">190 илј. EUR</text><text x="30" y="300" font-size="12.5" fill="#94A3B8" font-weight="400" text-anchor="start">590 илј. EUR чекаат подолго од месец. Без ваков список, никој нема да се јави.</text></svg>